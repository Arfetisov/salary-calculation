<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор зарплаты</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        
        // === ДАННЫЕ ===
        const MANAGER_PIN = '1234';
        const COMPANY_NAME = 'Омега Дизайн';
        
        const OPS = [
          { id: 'unload', name: 'Разгрузка комплектующих', unit: 'компл.' },
          { id: 'glass_cut', name: 'Резка стекла', unit: 'шт', hasComplexity: true },
          { id: 'lift', name: 'Подъём на лифте', unit: 'подъём' },
          { id: 'profile_cut', name: 'Раскрой профиля', unit: 'шт' },
          { id: 'milling', name: 'Фрезеровка профиля', unit: 'шт' },
          { id: 'drilling_profile', name: 'Присадка профиля', unit: 'шт' },
          { id: 'drilling_glass', name: 'Сверление стекла', unit: 'отв.' },
          { id: 'cleaning', name: 'Чистка перед сборкой', unit: 'компл.' },
          { id: 'sealant', name: 'Вставка уплотнителя', unit: 'шт' },
          { id: 'assembly', name: 'Сборка фасада', unit: 'шт', hasSize: true },
          { id: 'qc', name: 'Контроль качества', unit: 'шт' },
          { id: 'packing', name: 'Упаковка', unit: 'шт' },
          { id: 'shipping', name: 'Отгрузка', unit: 'компл.' },
        ];
        
        const DEFAULT_RATES = {
          unload: { rate: 50 },
          glass_cut: { rate: 150, complexity: { normal: 1, moro: 1.4 } },
          lift: { rate: 40 },
          profile_cut: { rate: 100 },
          milling: { rate: 120 },
          drilling_profile: { rate: 90 },
          drilling_glass: { rate: 50 },
          cleaning: { rate: 60 },
          sealant: { rate: 70 },
          assembly: { sizes: { small: 180, medium: 230, large: 290 } },
          qc: { rate: 80 },
          packing: { rate: 60 },
          shipping: { rate: 90 },
        };
        
        const SIZE_LABELS = { small: 'Малый', medium: 'Средний', large: 'Большой' };
        const COMPLEXITY_LABELS = { normal: 'Обычное', moro: 'Капризное (Моро и т.п.)' };
        
        // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===
        function money(n) {
          return Math.round(n).toLocaleString('ru-RU') + ' ₽';
        }
        
        function todayKey(ts) {
          return new Date(ts).toDateString();
        }
        
        function formatDate(ts) {
          const s = new Date(ts).toLocaleDateString('ru-RU', {
            day: 'numeric', month: 'long', weekday: 'long',
          });
          return s.charAt(0).toUpperCase() + s.slice(1);
        }
        
        function formatTime(ts) {
          return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }
        
        function formatDuration(sec) {
          if (sec == null) return '—';
          const m = Math.floor(sec / 60);
          const s = sec % 60;
          return `${m}:${String(s).padStart(2, '0')}`;
        }
        
        function formatShiftDuration(sec) {
          if (sec == null) return '—';
          const h = Math.floor(sec / 3600);
          const m = Math.floor((sec % 3600) / 60);
          return `${h} ч ${String(m).padStart(2, '0')} мин`;
        }
        
        function calcAmount(op, rates, qty, size, complexity) {
          const r = rates[op.id] || {};
          if (op.hasSize) {
            const base = (r.sizes && r.sizes[size]) || 0;
            return base * qty;
          }
          if (op.hasComplexity) {
            const base = r.rate || 0;
            const mult = (r.complexity && r.complexity[complexity]) || 1;
            return base * mult * qty;
          }
          return (r.rate || 0) * qty;
        }
        
        // === ХРАНИЛИЩЕ (localStorage) ===
        const storage = {
          get: (key) => {
            try {
              const value = localStorage.getItem(key);
              return Promise.resolve(value ? { value } : null);
            } catch (e) {
              return Promise.resolve(null);
            }
          },
          set: (key, value) => {
            try {
              localStorage.setItem(key, value);
              return Promise.resolve(true);
            } catch (e) {
              return Promise.resolve(false);
            }
          }
        };
        window.storage = storage;
        
        async function getJSON(key, shared, fallback) {
          try {
            const res = await window.storage.get(key);
            return res ? JSON.parse(res.value) : fallback;
          } catch (e) {
            return fallback;
          }
        }
        
        async function setJSON(key, shared, value) {
          try {
            await window.storage.set(key, JSON.stringify(value));
            return true;
          } catch (e) {
            return false;
          }
        }
        
        // === ГЛАВНОЕ ПРИЛОЖЕНИЕ ===
        function ShopFloorApp() {
          const [booting, setBooting] = useState(true);
          const [employees, setEmployees] = useState([]);
          const [rates, setRates] = useState(DEFAULT_RATES);
          const [screen, setScreen] = useState('select');
          const [currentEmployee, setCurrentEmployee] = useState(null);
          const [entries, setEntries] = useState([]);
          const [entriesLoading, setEntriesLoading] = useState(false);
          const [newName, setNewName] = useState('');
          const [order, setOrder] = useState('');
          const [openOp, setOpenOp] = useState(null);
          const [qty, setQty] = useState(1);
          const [size, setSize] = useState('small');
          const [complexity, setComplexity] = useState('normal');
          const [pinInput, setPinInput] = useState('');
          const [pinError, setPinError] = useState(false);
          const [managerTab, setManagerTab] = useState('totals');
          const [period, setPeriod] = useState('today');
          const [managerData, setManagerData] = useState({});
          const [managerLoading, setManagerLoading] = useState(false);
          const [editRates, setEditRates] = useState(null);
          const [saveMsg, setSaveMsg] = useState('');
          const [shifts, setShifts] = useState([]);
        
          useEffect(() => {
            (async () => {
              const emp = await getJSON('shop:employees', true, []);
              const r = await getJSON('shop:rates', true, DEFAULT_RATES);
              setEmployees(emp);
              setRates(r);
              setBooting(false);
            })();
          }, []);
        
          useEffect(() => {
            if (currentEmployee) {
              loadEntries(currentEmployee.id);
              loadShifts(currentEmployee.id);
            }
          }, [currentEmployee]);
        
          const loadEntries = async (empId) => {
            setEntriesLoading(true);
            const list = await getJSON(`shop:entries:${empId}`, true, []);
            setEntries(list);
            setEntriesLoading(false);
          };
        
          const loadShifts = async (empId) => {
            const list = await getJSON(`shop:shifts:${empId}`, true, []);
            setShifts(list);
          };
        
          const currentShift = shifts.find((s) => s.endTs == null) || null;
        
          const startShift = async () => {
            if (currentShift || !currentEmployee) return;
            const rec = { id: 's_' + Date.now(), startTs: Date.now(), endTs: null };
            const list = [rec, ...shifts];
            setShifts(list);
            await setJSON(`shop:shifts:${currentEmployee.id}`, true, list);
          };
        
          const endShift = async () => {
            if (!currentShift || !currentEmployee) return;
            const list = shifts.map((s) => (s.id === currentShift.id ? { ...s, endTs: Date.now() } : s));
            setShifts(list);
            await setJSON(`shop:shifts:${currentEmployee.id}`, true, list);
          };
        
          const addEmployee = async () => {
            const name = newName.trim();
            if (!name) return;
            const id = 'e_' + Date.now();
            const list = [...employees, { id, name }];
            setEmployees(list);
            await setJSON('shop:employees', true, list);
            setNewName('');
            setCurrentEmployee({ id, name });
            setScreen('employee');
          };
        
          const pickEmployee = (emp) => {
            setCurrentEmployee(emp);
            setScreen('employee');
          };
        
          const openOperation = (op) => {
            setOpenOp(op);
            setQty(1);
            setSize('small');
            setComplexity('normal');
          };
        
          const confirmEntry = async () => {
            if (!openOp) return;
            const amount = calcAmount(openOp, rates, qty, size, complexity);
            const entry = {
              id: 'x_' + Date.now(),
              ts: Date.now(),
              order: order.trim() || '—',
              opId: openOp.id,
              qty,
              size: openOp.hasSize ? size : null,
              complexity: openOp.hasComplexity ? complexity : null,
              amount,
            };
            const list = [entry, ...entries];
            setEntries(list);
            await setJSON(`shop:entries:${currentEmployee.id}`, true, list);
            setOpenOp(null);
          };
        
          const deleteEntry = async (id) => {
            const list = entries.filter((e) => e.id !== id);
            setEntries(list);
            await setJSON(`shop:entries:${currentEmployee.id}`, true, list);
          };
        
          const todayEntries = entries.filter((e) => todayKey(e.ts) === todayKey(Date.now()));
          const todayTotal = todayEntries.reduce((s, e) => s + e.amount, 0);
          const todayLabel = formatDate(Date.now());
        
          const tryManagerLogin = () => {
            if (pinInput === MANAGER_PIN) {
              setScreen('manager');
              setPinInput('');
              setPinError(false);
            } else {
              setPinError(true);
            }
          };
        
          const loadManagerData = useCallback(async () => {
            setManagerLoading(true);
            const start = (() => {
              const d = new Date();
              if (period === 'today') { d.setHours(0,0,0,0); return d.getTime(); }
              if (period === 'week') { const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d.getTime(); }
              return 0;
            })();
            const data = {};
            for (const emp of employees) {
              const list = await getJSON(`shop:entries:${emp.id}`, true, []);
              const filtered = list.filter((e) => e.ts >= start);
              data[emp.id] = {
                entries: filtered.sort((a,b) => b.ts - a.ts),
                total: filtered.reduce((s,e) => s + e.amount, 0),
              };
            }
            setManagerData(data);
            setManagerLoading(false);
          }, [employees, period]);
        
          useEffect(() => {
            if (screen === 'manager' && managerTab === 'totals') loadManagerData();
          }, [screen, managerTab, period, loadManagerData]);
        
          useEffect(() => {
            if (screen === 'manager' && managerTab === 'rates') {
              setEditRates(JSON.parse(JSON.stringify(rates)));
            }
          }, [screen, managerTab, rates]);
        
          const saveRates = async () => {
            setRates(editRates);
            await setJSON('shop:rates', true, editRates);
            setSaveMsg('Расценки сохранены');
            setTimeout(() => setSaveMsg(''), 2000);
          };
        
          // === СТИЛИ ===
          const bg = '#1c1f22';
          const panel = '#262b30';
          const panelAlt = '#2f353b';
          const border = '#3a4149';
          const text = '#f2f1ec';
          const textDim = '#9aa4ad';
          const accent = '#ff6a2b';
          const accentDim = 'rgba(255,106,43,0.16)';
          const good = '#4caf7d';
          const bad = '#e5484d';
        
          const styles = {
            root: {
              background: bg,
              color: text,
              fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
              minHeight: '100vh',
              maxWidth: 460,
              margin: '0 auto',
              padding: 16,
            },
            header: {
              padding: '10px 0',
              borderBottom: `1px solid ${border}`,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
            },
            eyebrow: {
              fontSize: 11,
              letterSpacing: '0.08em',
              textTransform: 'uppercase',
              color: textDim,
              fontWeight: 600,
            },
            h1: { fontSize: 18, fontWeight: 700, margin: '2px 0 0' },
            body: { padding: '10px 0' },
            button: {
              background: panelAlt,
              color: text,
              border: `1px solid ${border}`,
              borderRadius: 10,
              padding: '12px 14px',
              fontSize: 15,
              fontWeight: 600,
              cursor: 'pointer',
              display: 'flex',
              alignItems: 'center',
              gap: 10,
              width: '100%',
              textAlign: 'left',
            },
            primaryButton: {
              background: accent,
              color: '#1c1206',
              border: 'none',
              borderRadius: 10,
              padding: '13px 16px',
              fontSize: 15,
              fontWeight: 700,
              cursor: 'pointer',
              width: '100%',
            },
            input: {
              background: panelAlt,
              color: text,
              border: `1px solid ${border}`,
              borderRadius: 10,
              padding: '11px 12px',
              fontSize: 15,
              width: '100%',
              boxSizing: 'border-box',
            },
            card: {
              background: panel,
              border: `1px solid ${border}`,
              borderRadius: 12,
              padding: 14,
            },
            money: {
              fontFamily: "'SF Mono', 'Roboto Mono', ui-monospace, monospace",
              fontVariantNumeric: 'tabular-nums',
            },
          };
        
          if (booting) {
            return <div style={styles.root}><div style={{ textAlign: 'center', padding: 40, color: textDim }}>Загрузка...</div></div>;
          }
        
          // === ЭКРАН ВЫБОРА СОТРУДНИКА ===
          if (screen === 'select') {
            return (
              <div style={styles.root}>
                <div style={styles.header}>
                  <div>
                    <div style={styles.eyebrow}>Цех · учёт операций</div>
                    <div style={styles.h1}>Кто работает?</div>
                    <div style={{ fontSize: 12, color: textDim, marginTop: 3 }}>{todayLabel}</div>
                  </div>
                </div>
                <div style={styles.body}>
                  {employees.length === 0 && (
                    <div style={{ color: textDim, fontSize: 13, marginBottom: 8 }}>Пока никого нет. Добавьте первого сотрудника ниже.</div>
                  )}
                  {employees.map((emp) => (
                    <button key={emp.id} style={{ ...styles.button, marginBottom: 6 }} onClick={() => pickEmployee(emp)}>
                      <span style={{
                        width: 30, height: 30, borderRadius: '50%', background: accentDim, color: accent,
                        display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700,
                      }}>
                        {emp.name.trim().charAt(0).toUpperCase()}
                      </span>
                      {emp.name}
                    </button>
                  ))}
                  <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
                    <input
                      style={styles.input}
                      placeholder="Имя нового сотрудника"
                      value={newName}
                      onChange={(e) => setNewName(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && addEmployee()}
                    />
                    <button style={{ ...styles.primaryButton, width: 'auto', padding: '11px 16px' }} onClick={addEmployee}>
                      ➕
                    </button>
                  </div>
                  <button
                    style={{ ...styles.button, marginTop: 12, justifyContent: 'center', color: textDim }}
                    onClick={() => setScreen('pin')}
                  >
                    🔒 Режим руководителя
                  </button>
                </div>
              </div>
            );
          }
        
          // === ЭКРАН PIN ===
          if (screen === 'pin') {
            return (
              <div style={styles.root}>
                <div style={styles.header}>
                  <button style={{ background: 'none', border: 'none', color: textDim, cursor: 'pointer', fontSize: 18 }} onClick={() => { setScreen('select'); setPinError(false); setPinInput(''); }}>
                    ←
                  </button>
                  <div style={{ ...styles.h1, fontSize: 15 }}>Код руководителя</div>
                  <div style={{ width: 30 }} />
                </div>
                <div style={styles.body}>
                  <input
                    style={styles.input}
                    type="password"
                    inputMode="numeric"
                    placeholder="Введите код"
                    value={pinInput}
                    onChange={(e) => { setPinInput(e.target.value); setPinError(false); }}
                    onKeyDown={(e) => e.key === 'Enter' && tryManagerLogin()}
                    autoFocus
                  />
                  {pinError && <div style={{ color: bad, fontSize: 13, marginTop: 8 }}>Неверный код. Попробуйте ещё раз.</div>}
                  <button style={{ ...styles.primaryButton, marginTop: 12 }} onClick={tryManagerLogin}>Войти</button>
                </div>
              </div>
            );
          }
        
          // === ЭКРАН СОТРУДНИКА ===
          if (screen === 'employee' && currentEmployee) {
            return (
              <div style={styles.root}>
                <div style={styles.header}>
                  <button style={{ background: 'none', border: 'none', color: textDim, cursor: 'pointer', fontSize: 18 }} onClick={() => { setScreen('select'); setCurrentEmployee(null); setOrder(''); }}>
                    ←
                  </button>
                  <div style={{ textAlign: 'center' }}>
                    <div style={styles.eyebrow}>{currentEmployee.name}</div>
                    <div style={{ ...styles.h1, ...styles.money, color: accent }}>{money(todayTotal)}</div>
                  </div>
                  <div style={{ width: 30 }} />
                </div>
        
                <div style={styles.body}>
                  {/* Блок смены */}
                  <div style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    background: panelAlt, border: `1px solid ${border}`, borderRadius: 10,
                    padding: '10px 12px', marginBottom: 12,
                  }}>
                    <div>
                      <div style={{ fontSize: 11, color: textDim }}>{currentShift ? 'Смена идёт' : 'Смена не начата'}</div>
                      <div style={{ fontSize: 14, fontWeight: 700 }}>
                        {currentShift
                          ? `с ${formatTime(currentShift.startTs)} · ${formatShiftDuration(Math.floor((Date.now() - currentShift.startTs) / 1000))}`
                          : '—'}
                      </div>
                    </div>
                    <button
                      style={{
                        ...styles.button, width: 'auto', padding: '8px 14px',
                        background: currentShift ? 'rgba(229,72,77,0.14)' : accentDim,
                        border: `1px solid ${currentShift ? bad : accent}`,
                        color: currentShift ? bad : accent,
                      }}
                      onClick={currentShift ? endShift : startShift}
                    >
                      {currentShift ? '🚪 Закончить' : '🚪 Начать'}
                    </button>
                  </div>
        
                  <input
                    style={{ ...styles.input, marginBottom: 12 }}
                    placeholder="Номер заказа"
                    value={order}
                    onChange={(e) => setOrder(e.target.value)}
                  />
        
                  {/* Список операций */}
                  {!openOp && (
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                      {OPS.map((op) => (
                        <button key={op.id} style={{ ...styles.button, flexDirection: 'column', alignItems: 'flex-start', gap: 4, minHeight: 60 }} onClick={() => openOperation(op)}>
                          <span style={{ fontSize: 14, fontWeight: 600 }}>{op.name}</span>
                          <span style={{ fontSize: 11, color: textDim }}>{op.unit}</span>
                        </button>
                      ))}
                    </div>
                  )}
        
                  {/* Окно операции */}
                  {openOp && (
                    <div style={{ ...styles.card, marginTop: 12 }}>
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
                        <span style={{ fontWeight: 700, fontSize: 16 }}>{openOp.name}</span>
                        <button style={{ background: 'none', border: 'none', color: textDim, cursor: 'pointer', fontSize: 18 }} onClick={() => setOpenOp(null)}>✕</button>
                      </div>
        
                      {/* Размер */}
                      {openOp.hasSize && (
                        <div style={{ marginBottom: 12 }}>
                          <div style={{ fontSize: 12, color: textDim, marginBottom: 4 }}>Размер фасада</div>
                          <div style={{ display: 'flex', gap: 6 }}>
                            {Object.keys(SIZE_LABELS).map((s) => (
                              <button key={s} onClick={() => setSize(s)} style={{
                                flex: 1, padding: '8px 4px', borderRadius: 8, fontSize: 12, fontWeight: 600,
                                border: `1px solid ${s === size ? accent : border}`,
                                background: s === size ? accentDim : panelAlt,
                                color: s === size ? accent : text,
                              }}>{SIZE_LABELS[s]}</button>
                            ))}
                          </div>
                        </div>
                      )}
        
                      {/* Сложность */}
                      {openOp.hasComplexity && (
                        <div style={{ marginBottom: 12 }}>
                          <div style={{ fontSize: 12, color: textDim, marginBottom: 4 }}>Материал</div>
                          <div style={{ display: 'flex', gap: 6 }}>
                            {Object.keys(COMPLEXITY_LABELS).map((c) => (
                              <button key={c} onClick={() => setComplexity(c)} style={{
                                flex: 1, padding: '8px 4px', borderRadius: 8, fontSize: 11, fontWeight: 600,
                                border: `1px solid ${c === complexity ? accent : border}`,
                                background: c === complexity ? accentDim : panelAlt,
                                color: c === complexity ? accent : text,
                              }}>{COMPLEXITY_LABELS[c]}</button>
                            ))}
                          </div>
                        </div>
                      )}
        
                      {/* Количество */}
                      <div style={{ marginBottom: 12 }}>
                        <div style={{ fontSize: 12, color: textDim, marginBottom: 4 }}>Количество, {openOp.unit}</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                          <button style={{ ...styles.button, width: 40, height: 40, padding: 0, justifyContent: 'center' }} onClick={() => setQty((q) => Math.max(1, q - 1))}>
                            −
                          </button>
                          <span style={{ fontSize: 22, fontWeight: 700, minWidth: 40, textAlign: 'center', ...styles.money }}>{qty}</span>
                          <button style={{ ...styles.button, width: 40, height: 40, padding: 0, justifyContent: 'center' }} onClick={() => setQty((q) => q + 1)}>
                            +
                          </button>
                        </div>
                      </div>
        
                      {/* Сумма */}
                      <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: `1px solid ${border}`, paddingTop: 10, marginBottom: 12 }}>
                        <span style={{ fontSize: 13, color: textDim }}>Начислится</span>
                        <span style={{ fontSize: 20, fontWeight: 700, color: good, ...styles.money }}>
                          +{money(calcAmount(openOp, rates, qty, size, complexity))}
                        </span>
                      </div>
        
                      <button style={styles.primaryButton} onClick={confirmEntry}>✅ Добавить запись</button>
                    </div>
                  )}
        
                  {/* Записи за сегодня */}
                  <div style={{ marginTop: 18 }}>
                    <div style={{ ...styles.eyebrow, marginBottom: 8 }}>{todayLabel} · {todayEntries.length} записей</div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {todayEntries.map((e) => {
                        const op = OPS.find((o) => o.id === e.opId);
                        return (
                          <div key={e.id} style={{ ...styles.card, padding: '10px 12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div>
                              <div style={{ fontSize: 13, fontWeight: 600 }}>{op ? op.name : e.opId}</div>
                              <div style={{ fontSize: 11, color: textDim }}>
                                Заказ {e.order} · {e.qty} {op ? op.unit : ''}
                                {e.size ? `, ${SIZE_LABELS[e.size]}` : ''}
                              </div>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                              <span style={{ fontSize: 14, fontWeight: 700, color: good, ...styles.money }}>{money(e.amount)}</span>
                              <button style={{ background: 'none', border: 'none', color: textDim, cursor: 'pointer', padding: 4 }} onClick={() => deleteEntry(e.id)}>🗑</button>
                            </div>
                          </div>
                        );
                      })}
                      {todayEntries.length === 0 && (
                        <div style={{ color: textDim, fontSize: 13 }}>Записей ещё нет. Выберите операцию выше.</div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            );
          }
        
          // === ЭКРАН РУКОВОДИТЕЛЯ ===
          if (screen === 'manager') {
            return (
              <div style={styles.root}>
                <div style={styles.header}>
                  <button style={{ background: 'none', border: 'none', color: textDim, cursor: 'pointer', fontSize: 18 }} onClick={() => setScreen('select')}>←</button>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span>👥</span>
                    <div style={{ ...styles.h1, fontSize: 15 }}>Руководитель</div>
                  </div>
                  <div style={{ width: 30 }} />
                </div>
        
                <div style={{ display: 'flex', borderBottom: `1px solid ${border}`, marginBottom: 12 }}>
                  {[['totals', 'Сводка'], ['rates', 'Расценки']].map(([id, label]) => (
                    <button key={id} onClick={() => setManagerTab(id)} style={{
                      flex: 1, padding: '10px 0', background: 'none', border: 'none', cursor: 'pointer',
                      color: managerTab === id ? accent : textDim,
                      borderBottom: managerTab === id ? `2px solid ${accent}` : '2px solid transparent',
                      fontSize: 13, fontWeight: 700,
                    }}>{label}</button>
                  ))}
                </div>
        
                {managerTab === 'totals' && (
                  <div>
                    <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
                      {[['today', 'Сегодня'], ['week', 'Неделя'], ['all', 'Всё время']].map(([id, label]) => (
                        <button key={id} onClick={() => setPeriod(id)} style={{
                          flex: 1, padding: '8px 4px', borderRadius: 8, fontSize: 12, fontWeight: 600,
                          border: `1px solid ${period === id ? accent : border}`,
                          background: period === id ? accentDim : panelAlt,
                          color: period === id ? accent : text,
                        }}>{label}</button>
                      ))}
                    </div>
        
                    {managerLoading && <div style={{ color: textDim, textAlign: 'center', padding: 20 }}>Загрузка...</div>}
        
                    {employees.map((emp) => {
                      const d = managerData[emp.id] || { entries: [], total: 0 };
                      return (
                        <div key={emp.id} style={{ ...styles.card, marginBottom: 8 }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                            <span style={{ fontWeight: 600 }}>{emp.name}</span>
                            <span style={{ fontWeight: 700, color: good, ...styles.money }}>{money(d.total)}</span>
                          </div>
                          <div style={{ fontSize: 12, color: textDim }}>{d.entries.length} операций</div>
                        </div>
                      );
                    })}
        
                    {employees.length > 0 && (
                      <div style={{ ...styles.card, background: panelAlt, marginTop: 8 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                          <span style={{ fontWeight: 600 }}>Итого по цеху</span>
                          <span style={{ fontWeight: 700, ...styles.money }}>
                            {money(Object.values(managerData).reduce((s, d) => s + (d.total || 0), 0))}
                          </span>
                        </div>
                      </div>
                    )}
        
                    <button style={{ ...styles.button, marginTop: 10, justifyContent: 'center', fontSize: 12 }} onClick={loadManagerData}>
                      🔄 Обновить
                    </button>
                  </div>
                )}
        
                {managerTab === 'rates' && editRates && (
                  <div>
                    <div style={{ fontSize: 12, color: textDim, marginBottom: 12 }}>Изменение расценок — только для новых записей.</div>
                    {OPS.map((op) => (
                      <div key={op.id} style={{ ...styles.card, marginBottom: 8 }}>
                        <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 6 }}>{op.name}</div>
                        {op.hasSize ? (
                          <div style={{ display: 'flex', gap: 6 }}>
                            {Object.keys(SIZE_LABELS).map((s) => (
                              <div key={s} style={{ flex: 1 }}>
                                <div style={{ fontSize: 10, color: textDim }}>{SIZE_LABELS[s]}</div>
                                <input
                                  style={{ ...styles.input, padding: '6px', fontSize: 13 }}
                                  type="number"
                                  value={editRates.assembly.sizes[s]}
                                  onChange={(e) => setEditRates((prev) => ({
                                    ...prev,
                                    assembly: { ...prev.assembly, sizes: { ...prev.assembly.sizes, [s]: Number(e.target.value) } },
                                  }))}
                                />
                              </div>
                            ))}
                          </div>
                        ) : op.hasComplexity ? (
                          <div style={{ display: 'flex', gap: 6 }}>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontSize: 10, color: textDim }}>Базовая ставка</div>
                              <input
                                style={{ ...styles.input, padding: '6px', fontSize: 13 }}
                                type="number"
                                value={editRates.glass_cut.rate}
                                onChange={(e) => setEditRates((prev) => ({ ...prev, glass_cut: { ...prev.glass_cut, rate: Number(e.target.value) } }))}
                              />
                            </div>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontSize: 10, color: textDim }}>Коэф. капризное</div>
                              <input
                                style={{ ...styles.input, padding: '6px', fontSize: 13 }}
                                type="number"
                                step="0.1"
                                value={editRates.glass_cut.complexity.moro}
                                onChange={(e) => setEditRates((prev) => ({
                                  ...prev,
                                  glass_cut: { ...prev.glass_cut, complexity: { ...prev.glass_cut.complexity, moro: Number(e.target.value) } },
                                }))}
                              />
                            </div>
                          </div>
                        ) : (
                          <input
                            style={{ ...styles.input, padding: '6px', fontSize: 13 }}
                            type="number"
                            value={editRates[op.id].rate}
                            onChange={(e) => setEditRates((prev) => ({ ...prev, [op.id]: { ...prev[op.id], rate: Number(e.target.value) } }))}
                          />
                        )}
                      </div>
                    ))}
                    <button style={styles.primaryButton} onClick={saveRates}>💾 Сохранить расценки</button>
                    {saveMsg && <div style={{ color: good, marginTop: 8, textAlign: 'center' }}>{saveMsg}</div>}
                  </div>
                )}
              </div>
            );
          }
        
          return <div style={styles.root}><div style={{ textAlign: 'center', padding: 40, color: textDim }}>Ошибка загрузки</div></div>;
        }
        
        // === ЗАПУСК ===
        ReactDOM.createRoot(document.getElementById('root')).render(<ShopFloorApp />);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</body>
</html>
